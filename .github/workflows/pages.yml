name: pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-docs.mjs'
      - 'scripts/build-live-world.mjs'
      - 'crates/**'
      - 'worlds/**'
      - 'scripts/build-wasm.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install lockfile-matched wasm-bindgen CLI
        run: |
          BINDGEN_VERSION=$(python -c 'import tomllib; d=tomllib.load(open("Cargo.lock","rb")); print(next(p["version"] for p in d["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$BINDGEN_VERSION" --locked
      - run: bash scripts/build-wasm.sh
      - name: Build the documentation
        run: |
          node scripts/build-docs.mjs
          cargo doc --no-deps -p computerworld --lib
          mkdir -p site/docs/api
          cp -r target/doc site/docs/api/rust
      # site/live.js imports the bundle from site/pkg/ and the world from
      # site/world-definition.js, which scripts/build-content.sh keeps generated.
      - name: Assemble the site
        run: cp -r pkg/web site/pkg
      - uses: ./.github/actions/browser
      - name: The machines run in the bundle about to be deployed
        # Gating the deploy rather than only the push: what ships is this bundle with this
        # site, and the pair of them is what has to work.
        run: node scripts/check-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
