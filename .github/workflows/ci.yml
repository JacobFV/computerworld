name: verify
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/test-all.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The documentation converts, and the Rust reference builds
        run: |
          node scripts/build-docs.mjs --check
          cargo doc --no-deps -p computerworld --lib
  format:
    # Its own job, not a step inside `rust`: `cargo fmt --all -- --check` fails
    # today on a reformat spanning 246 files, and as a step it took the tests,
    # the lint, the Wasm build and the generated-content check down with it. On
    # its own it says exactly one thing, and the rest of the workflow reports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
  site:
    # The page is the only part of this project nothing else in CI exercises: the Rust
    # suites prove the engine and the bindings smoke test proves the two language
    # bindings, but whether a visitor gets a running computer lives entirely in
    # site/live.js, site/worker.js and site/engine.js and in the protocol between them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen
        run: |
          BINDGEN_VERSION=$(python -c 'import tomllib; d=tomllib.load(open("Cargo.lock","rb")); print(next(p["version"] for p in d["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$BINDGEN_VERSION" --locked
      - name: Build the bundle the machines run in
        run: |
          bash scripts/build-wasm.sh
          cp -r pkg/web site/pkg
      - uses: ./.github/actions/browser
      - run: node scripts/check-site.mjs
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen and Python build tooling
        run: |
          BINDGEN_VERSION=$(python -c 'import tomllib; d=tomllib.load(open("Cargo.lock","rb")); print(next(p["version"] for p in d["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$BINDGEN_VERSION" --locked
          python -m pip install maturin
      - run: bash scripts/smoke-bindings.sh
      - name: Run programmatic JavaScript and Python computer interaction demos
        run: |
          node examples/javascript/computer-interaction.mjs --output target/javascript-demo
          python examples/python/computer_interaction.py --output target/python-demo --compare target/javascript-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binding-evidence
          path: |
            target/binding-checks/
            target/javascript-demo/
            target/python-demo/
