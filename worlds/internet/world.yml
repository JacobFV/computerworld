# The built-in internet, as a blueprint.
#
# `world.json` beside this file is generated from it and is not edited by hand:
#
#     cargo run -p cw-blueprint --bin cw-world -- build worlds/internet/world.yml
#
# It joins every world that does not set `internet: false` (see crates/internet): the
# backbone below, the public DNS, and one service per file under `sites/`, each placing
# its own node, link and DNS records through its `place:` block and the defaults here.
# A world uplinks through `edge-router` and may hang its own public sites off the
# points of presence; those five nodes are cw_protocol::INTERNET_ATTACHMENTS.
schema_version: 1
id: "internet"
internet: false
defaults:
