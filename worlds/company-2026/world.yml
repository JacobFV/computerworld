# The reference company, as a blueprint.
#
# `world.json` beside this file is generated from it and is not edited by hand:
#
#     cargo run -p cw-blueprint --bin cw-world -- build worlds/company-2026/world.yml
#
# The three desktops are seeded from `home/`, every service but the six below
# comes from its own file under `sites/`, and each of those places its own node,
# link and DNS records through the `place:` block and the defaults here.
schema_version: 1
id: "northstar-company-2026"
defaults:
  build_only: ["search_entries", "authority_overrides"]
  place:
    zone: "internet"
    link: {latency_us: 1500}
    dns:
      internet: {ttl_us: 300000000, resolver: "dns-public"}
      local: {ttl_us: 60000000, resolver: "app-server"}
profiles:
  - id: "macos"
    name: "macOS workstation"
    family: "macos"
    home: "/Users/{user}"
    case_sensitive: false
    shell: "posix"
  - id: "windows"
    name: "Windows workstation"
    family: "windows"
    home: "C:/Users/{user}"
    case_sensitive: false
    shell: "powershell"
  - id: "ubuntu"
    name: "Ubuntu"
    family: "linux"
    home: "/home/{user}"
    case_sensitive: true
    shell: "posix"
computers:
  - id: "alice-mac"
    profile: "macos"
    address: "10.0.0.10"
    user: "alice"
    copy:
      - {from: "home/all"}
      - {from: "home/macos"}
    installed_apps: ["terminal", "browser", "editor", "files", "desktop", "code", "freecad"]
    packages: ["coreutils", "git", "curl"]
  - id: "bob-windows"
    profile: "windows"
    address: "10.0.0.11"
    user: "bob"
    copy:
      - {from: "home/all"}
      - {from: "home/windows"}
    installed_apps: ["terminal", "browser", "editor", "files", "desktop", "code", "freecad"]
    packages: ["coreutils", "git", "curl"]
  - id: "carol-ubuntu"
    profile: "ubuntu"
    address: "10.0.0.12"
    user: "carol"
    copy:
      - {from: "home/all"}
      - {from: "home/ubuntu"}
    installed_apps: ["terminal", "browser", "editor", "files", "desktop", "code", "freecad"]
    packages: ["coreutils", "git", "curl"]
  - id: "app-server"
    profile: "ubuntu"
    address: "10.0.0.13"
    user: "admin"
    initial_files:
      "launch.txt": |
        Project: Atlas
        Checklist: launch
        Status: pending
        Documents: http://docs.internal/
      "notes.txt": |
        Welcome admin. Start at http://intranet.internal/
    installed_apps: ["terminal", "browser", "editor", "files", "desktop"]
    packages: ["coreutils", "git", "curl"]
  - id: "git-server"
    profile: "ubuntu"
    address: "10.0.0.14"
    user: "admin"
    initial_files:
      "launch.txt": |
        Project: Atlas
        Checklist: launch
        Status: pending
        Documents: http://docs.internal/
      "notes.txt": |
        Welcome admin. Start at http://intranet.internal/
    installed_apps: ["terminal", "browser", "editor", "files", "desktop"]
    packages: ["coreutils", "git", "curl"]
