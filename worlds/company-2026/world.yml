# The reference company, as a blueprint.
#
# `world.json` beside this file is generated from it and is not edited by hand:
#
#     cargo run -p cw-blueprint --bin cw-world -- build worlds/company-2026/world.yml
#
# The three desktops are seeded from `home/`, every service but the six below
# comes from its own file under `sites/`, and each of those places its own node,
# link and DNS records through the `place:` block and the defaults here. The
# public web is not declared here: the world joins the built-in internet
# (worlds/internet) at boot, uplinks to it from app-server through edge-router,
# and hangs its own public sites off the internet's points of presence.
schema_version: 1
id: "northstar-company-2026"
defaults:
  place:
    zone: "internet"
    link: {latency_us: 1500}
    dns:
      internet: {ttl_us: 300000000, resolver: "dns-public"}
      local: {ttl_us: 60000000, resolver: "app-server"}
profiles:
  - id: "macos"
    name: "macOS workstation"
    family: "macos"
    home: "/Users/{user}"
    case_sensitive: false
    shell: "posix"
  - id: "windows"
    name: "Windows workstation"
    family: "windows"
    home: "C:/Users/{user}"
    case_sensitive: false
    shell: "powershell"
  - id: "ubuntu"
    name: "Ubuntu"
    family: "linux"
    home: "/home/{user}"
    case_sensitive: true
    shell: "posix"
computers:
  - id: "alice-mac"
    profile: "macos"
    address: "10.0.0.10"
    user: "alice"
    copy:
      - {from: "home/all"}
      - {from: "home/macos"}
    installed_apps: ["terminal", "browser", "editor", "files", "desktop", "code", "freecad"]
    packages: ["coreutils", "git", "curl"]
  - id: "bob-windows"
    profile: "windows"
    address: "10.0.0.11"
    user: "bob"
    copy:
      - {from: "home/all"}
      - {from: "home/windows"}
    installed_apps: ["terminal", "browser", "editor", "files", "desktop", "code", "freecad"]
    packages: ["coreutils", "git", "curl"]
  - id: "carol-ubuntu"
    profile: "ubuntu"
    address: "10.0.0.12"
    user: "carol"
    copy:
      - {from: "home/all"}
      - {from: "home/ubuntu"}
    installed_apps: ["terminal", "browser", "editor", "files", "desktop", "code", "freecad"]
    packages: ["coreutils", "git", "curl"]
  - id: "app-server"
    profile: "ubuntu"
    address: "10.0.0.13"
    user: "admin"
    initial_files:
      "launch.txt": |
        Project: Atlas
        Checklist: launch
        Status: pending
        Documents: http://docs.internal/
      "notes.txt": |
        Welcome admin. Start at http://intranet.internal/
    installed_apps: ["terminal", "browser", "editor", "files", "desktop"]
    packages: ["coreutils", "git", "curl"]
  - id: "git-server"
    profile: "ubuntu"
    address: "10.0.0.14"
    user: "admin"
    initial_files:
      "launch.txt": |
        Project: Atlas
        Checklist: launch
        Status: pending
        Documents: http://docs.internal/
      "notes.txt": |
        Welcome admin. Start at http://intranet.internal/
    installed_apps: ["terminal", "browser", "editor", "files", "desktop"]
    packages: ["coreutils", "git", "curl"]
network:
  nodes:
    - {id: "alice-mac", address: "10.0.0.10", zone: "local"}
    - {id: "bob-windows", address: "10.0.0.11", zone: "local"}
    - {id: "carol-ubuntu", address: "10.0.0.12", zone: "local"}
    - {id: "app-server", address: "10.0.0.13", zone: "local"}
    - {id: "git-server", address: "10.0.0.14", zone: "local"}
    - {id: "mail-node", address: "10.0.1.10", zone: "local"}
    - {id: "docs-node", address: "10.0.1.11", zone: "local"}
    - {id: "chat-node", address: "10.0.1.12", zone: "local"}
    - {id: "calendar-node", address: "10.0.1.13", zone: "local"}
    - {id: "issues-node", address: "10.0.1.15", zone: "local"}
    - {id: "guide-node", address: "203.0.113.10", zone: "internet"}
    - {id: "alice-blog", address: "198.51.100.70", zone: "internet"}
    - {id: "bob-blog", address: "198.51.100.71", zone: "internet"}
    - {id: "northstar-eng", address: "198.51.100.72", zone: "internet"}
    - {id: "northstar-www", address: "198.51.100.80", zone: "internet"}
    - {id: "northstar-status", address: "198.51.100.81", zone: "internet"}
  links:
    - {from: "app-server", to: "alice-mac", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "bob-windows", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "carol-ubuntu", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "git-server", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "mail-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "docs-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "chat-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "calendar-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "issues-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "guide-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "edge-router", bidirectional: true, latency_us: 3000, loss_per_million: 0}
    - {from: "pop-west", to: "alice-blog", bidirectional: true, latency_us: 2600, loss_per_million: 0}
    - {from: "pop-west", to: "northstar-www", bidirectional: true, latency_us: 800, loss_per_million: 0}
    - {from: "pop-west", to: "northstar-eng", bidirectional: true, latency_us: 800, loss_per_million: 0}
    - from: "pop-west"
      to: "northstar-status"
      bidirectional: true
      latency_us: 800
      loss_per_million: 0
    - {from: "pop-west", to: "guide-node", bidirectional: true, latency_us: 2500, loss_per_million: 0}
    - {from: "pop-east", to: "bob-blog", bidirectional: true, latency_us: 3100, loss_per_million: 0}
  dns:
    - {name: "alicechen.dev", address: "198.51.100.70", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "bedroom.speaker.internal", address: "10.0.2.23", ttl_us: 60000000, resolver: "app-server"}
    - {name: "bmartinez.net", address: "198.51.100.71", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "calendar.internal", address: "10.0.1.13", ttl_us: 60000000, resolver: "app-server"}
    - name: "calendar.northstar.example"
      address: "calendar.internal"
      ttl_us: 60000000
      resolver: "app-server"
    - {name: "chat.internal", address: "10.0.1.12", ttl_us: 60000000, resolver: "app-server"}
    - {name: "chat.northstar.example", address: "chat.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "docs.internal", address: "10.0.1.11", ttl_us: 60000000, resolver: "app-server"}
    - {name: "docs.northstar.example", address: "docs.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "eng.northstar.example", address: "198.51.100.72", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "git.internal", address: "10.0.0.14", ttl_us: 60000000, resolver: "app-server"}
    - {name: "git.northstar.example", address: "git.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "guide.example", address: "203.0.113.10", ttl_us: 60000000, resolver: "app-server"}
    - {name: "help.northstar.example", address: "guide.example", ttl_us: 60000000, resolver: "app-server"}
    - {name: "intranet.internal", address: "10.0.0.13", ttl_us: 60000000, resolver: "app-server"}
    - name: "intranet.northstar.example"
      address: "intranet.internal"
      ttl_us: 60000000
      resolver: "app-server"
    - {name: "issues.internal", address: "10.0.1.15", ttl_us: 60000000, resolver: "app-server"}
    - name: "issues.northstar.example"
      address: "issues.internal"
      ttl_us: 60000000
      resolver: "app-server"
    - {name: "mail.internal", address: "10.0.1.10", ttl_us: 60000000, resolver: "app-server"}
    - {name: "mail.northstar.example", address: "mail.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "northstar.example", address: "198.51.100.80", ttl_us: 300000000, resolver: "dns-public"}
    - name: "status.northstar.example"
      address: "198.51.100.81"
      ttl_us: 300000000
      resolver: "dns-public"
    - {name: "www.alicechen.dev", address: "alicechen.dev", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "www.bmartinez.net", address: "bmartinez.net", ttl_us: 300000000, resolver: "dns-public"}
    - name: "www.northstar.example"
      address: "northstar.example"
      ttl_us: 300000000
      resolver: "dns-public"
  routes: []
  gateway:
    allow_local: true
    allow_internet: true
    allow_host: false
    host_allowlist: []
    denied_pairs: []
services:
  - id: "mail"
    kind: "mail"
    node: "mail-node"
    domains: ["mail.internal"]
    port: 80
    initial_state:
      users: ["alice", "bob", "carol", "admin"]
      next_id: 1
      messages:
        "mail-1":
          id: "mail-1"
          sender: "carol"
          to: ["alice"]
          cc: ["bob"]
          subject: "Atlas launch checklist"
          body: "Review document launch at http://docs.internal/documents/launch. The release code is ATLAS-2026. Update the document after validating launch.txt, then tell #general. Follow OPS-1 at http://issues.internal/."
          time: 0
          mailboxes:
            alice:
              folders: ["inbox"]
              labels: []
              read: false
            bob:
              folders: ["inbox"]
              labels: []
              read: false
            carol:
              folders: ["sent"]
              labels: []
              read: true
  - id: "docs"
    kind: "docs"
    node: "docs-node"
    domains: ["docs.internal"]
    port: 80
    initial_state:
      next_id: 0
      documents:
        launch:
          id: "launch"
          title: "Atlas launch checklist"
          owner: "carol"
          readers: ["alice", "bob"]
          writers: ["alice", "bob"]
          body: |
            Atlas release checklist
            Status: pending
            Release code: awaiting confirmation
            Owner: Carol
            Related issue: OPS-1
            Repository: http://git.internal/repos/onboarding
          revision: 1
          history: []
          comments: []
        handbook:
          id: "handbook"
          title: "Northstar handbook"
          owner: "admin"
          readers: ["alice", "bob", "carol"]
          writers: ["carol"]
          body: "Find launch instructions in mail.internal. Project chat is general at chat.internal. Team calendar is calendar.internal. Public documentation: http://guide.example/."
          revision: 1
          history: []
          comments: []
          body_variants:
            - "Northstar release review rotation: Alice leads this episode. Find launch instructions in mail.internal. Team chat is general at chat.internal. Public guide: http://guide.example/."
            - "Northstar release review rotation: Bob leads this episode. Find launch instructions in mail.internal. Team chat is general at chat.internal. Public guide: http://guide.example/."
            - "Northstar release review rotation: Carol leads this episode. Find launch instructions in mail.internal. Team chat is general at chat.internal. Public guide: http://guide.example/."
  - id: "chat"
    kind: "chat"
    node: "chat-node"
    domains: ["chat.internal"]
    port: 80
    initial_state:
      next_id: 0
      channels:
        general:
          title: "General"
          members: ["alice", "bob", "carol", "admin"]
          messages: []
  - id: "calendar"
    kind: "calendar"
    node: "calendar-node"
    domains: ["calendar.internal"]
    port: 80
    initial_state:
      next_id: 1
      events:
        "event-1":
          id: "event-1"
          owner: "carol"
          title: "Atlas launch review"
          start: 3600000000
          end: 5400000000
          created: 0
          attendees: {alice: "pending", bob: "pending"}
  - id: "git"
    kind: "git"
    node: "git-server"
    domains: ["git.internal"]
    port: 80
    initial_state:
      repositories:
        onboarding:
          files:
            "README.md": |
              # Atlas onboarding
              Use http://intranet.internal/ to find the launch checklist.
            "checklist.txt": |
              mail read: pending
              document updated: pending
          readers: ["alice", "bob", "carol"]
          writers: ["alice", "bob", "carol"]
  - id: "issues"
    kind: "issues"
    node: "issues-node"
    domains: ["issues.internal"]
    port: 80
    initial_state:
      projects:
        OPS:
          name: "Operations"
          issues:
            "1":
              id: 1
              title: "Confirm Atlas launch checklist"
              body: "Read the release code from mail, update document launch, and publish checklist.txt to onboarding."
              status: "open"
              author: "carol"
              assignee: "alice"
              comments: []
              reviews: []
              kind: "issue"
metadata:
  description: "Fictional small company ecosystem"
  users: ["alice", "bob", "carol", "admin"]
  reference_version: 1
  device_presentations:
    "alice-mac": "desktop"
    "bob-windows": "desktop"
    "carol-ubuntu": "laptop"
    "app-server": "server"
    "git-server": "server"
include:
  - "sites/intranet.json"
  - "sites/guide.json"
  - "sites/alice-blog.json"
  - "sites/bob-blog.json"
  - "sites/northstar-eng.json"
  - "sites/northstar-status.json"
  - "sites/northstar-www.json"
  - "sites/kitchen-speaker.json"
  - "sites/livingroom-speaker.json"
  - "sites/office-tv-speaker.json"
  - "network/bedroom-speaker.json"
  - "sites/messages.json"
