# The reference company, as a blueprint.
#
# `world.json` beside this file is generated from it and is not edited by hand:
#
#     cargo run -p cw-blueprint --bin cw-world -- build worlds/company-2026/world.yml
#
# Each machine is a directory under `computers/` and each service one under
# `services/`; a service that states a `place:` block gets its node, link and DNS
# records from it and the defaults here. The public web is not declared here:
# the world joins the built-in internet (worlds/internet) at boot, uplinks to it
# from app-server through edge-router, and hangs its own public sites off the
# internet's points of presence.
schema_version: 1
id: "northstar-company-2026"
defaults:
  place:
    zone: "internet"
    link: {latency_us: 1500}
    dns:
      internet: {ttl_us: 300000000, resolver: "dns-public"}
      local: {ttl_us: 60000000, resolver: "app-server"}
profiles:
  - id: "macos"
    name: "macOS workstation"
    family: "macos"
    home: "/Users/{user}"
    case_sensitive: false
    shell: "posix"
  - id: "windows"
    name: "Windows workstation"
    family: "windows"
    home: "C:/Users/{user}"
    case_sensitive: false
    shell: "powershell"
  - id: "ubuntu"
    name: "Ubuntu"
    family: "linux"
    home: "/home/{user}"
    case_sensitive: true
    shell: "posix"
network:
  nodes:
    - {id: "alice-mac", address: "10.0.0.10", zone: "local"}
    - {id: "bob-windows", address: "10.0.0.11", zone: "local"}
    - {id: "carol-ubuntu", address: "10.0.0.12", zone: "local"}
    - {id: "app-server", address: "10.0.0.13", zone: "local"}
    - {id: "git-server", address: "10.0.0.14", zone: "local"}
    - {id: "mail-node", address: "10.0.1.10", zone: "local"}
    - {id: "docs-node", address: "10.0.1.11", zone: "local"}
    - {id: "chat-node", address: "10.0.1.12", zone: "local"}
    - {id: "calendar-node", address: "10.0.1.13", zone: "local"}
    - {id: "issues-node", address: "10.0.1.15", zone: "local"}
    # The bedroom speaker is unplugged: its node and link are here, and nothing listens.
    - {id: "bedroom-speaker", address: "10.0.2.23", zone: "local"}
    - {id: "guide-node", address: "203.0.113.10", zone: "internet"}
    - {id: "alice-blog", address: "198.51.100.70", zone: "internet"}
    - {id: "bob-blog", address: "198.51.100.71", zone: "internet"}
    - {id: "northstar-eng", address: "198.51.100.72", zone: "internet"}
    - {id: "northstar-www", address: "198.51.100.80", zone: "internet"}
    - {id: "northstar-status", address: "198.51.100.81", zone: "internet"}
  links:
    - {from: "app-server", to: "alice-mac", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "bob-windows", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "carol-ubuntu", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "git-server", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "mail-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "docs-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "chat-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "calendar-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "issues-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "bedroom-speaker", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "guide-node", bidirectional: true, latency_us: 10, loss_per_million: 0}
    - {from: "app-server", to: "edge-router", bidirectional: true, latency_us: 3000, loss_per_million: 0}
    - {from: "pop-west", to: "alice-blog", bidirectional: true, latency_us: 2600, loss_per_million: 0}
    - {from: "pop-west", to: "northstar-www", bidirectional: true, latency_us: 800, loss_per_million: 0}
    - {from: "pop-west", to: "northstar-eng", bidirectional: true, latency_us: 800, loss_per_million: 0}
    - from: "pop-west"
      to: "northstar-status"
      bidirectional: true
      latency_us: 800
      loss_per_million: 0
    - {from: "pop-west", to: "guide-node", bidirectional: true, latency_us: 2500, loss_per_million: 0}
    - {from: "pop-east", to: "bob-blog", bidirectional: true, latency_us: 3100, loss_per_million: 0}
  dns:
    - {name: "alicechen.dev", address: "198.51.100.70", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "bedroom.speaker.internal", address: "10.0.2.23", ttl_us: 60000000, resolver: "app-server"}
    - {name: "bmartinez.net", address: "198.51.100.71", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "calendar.internal", address: "10.0.1.13", ttl_us: 60000000, resolver: "app-server"}
    - name: "calendar.northstar.example"
      address: "calendar.internal"
      ttl_us: 60000000
      resolver: "app-server"
    - {name: "chat.internal", address: "10.0.1.12", ttl_us: 60000000, resolver: "app-server"}
    - {name: "chat.northstar.example", address: "chat.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "docs.internal", address: "10.0.1.11", ttl_us: 60000000, resolver: "app-server"}
    - {name: "docs.northstar.example", address: "docs.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "eng.northstar.example", address: "198.51.100.72", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "git.internal", address: "10.0.0.14", ttl_us: 60000000, resolver: "app-server"}
    - {name: "git.northstar.example", address: "git.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "guide.example", address: "203.0.113.10", ttl_us: 60000000, resolver: "app-server"}
    - {name: "help.northstar.example", address: "guide.example", ttl_us: 60000000, resolver: "app-server"}
    - {name: "intranet.internal", address: "10.0.0.13", ttl_us: 60000000, resolver: "app-server"}
    - name: "intranet.northstar.example"
      address: "intranet.internal"
      ttl_us: 60000000
      resolver: "app-server"
    - {name: "issues.internal", address: "10.0.1.15", ttl_us: 60000000, resolver: "app-server"}
    - name: "issues.northstar.example"
      address: "issues.internal"
      ttl_us: 60000000
      resolver: "app-server"
    - {name: "mail.internal", address: "10.0.1.10", ttl_us: 60000000, resolver: "app-server"}
    - {name: "mail.northstar.example", address: "mail.internal", ttl_us: 60000000, resolver: "app-server"}
    - {name: "northstar.example", address: "198.51.100.80", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "northstar.slack.com", address: "slack.com", ttl_us: 300000000, resolver: "dns-public"}
    - name: "status.northstar.example"
      address: "198.51.100.81"
      ttl_us: 300000000
      resolver: "dns-public"
    - {name: "www.alicechen.dev", address: "alicechen.dev", ttl_us: 300000000, resolver: "dns-public"}
    - {name: "www.bmartinez.net", address: "bmartinez.net", ttl_us: 300000000, resolver: "dns-public"}
    - name: "www.northstar.example"
      address: "northstar.example"
      ttl_us: 300000000
      resolver: "dns-public"
  routes: []
  gateway:
    allow_local: true
    allow_internet: true
    allow_host: false
    host_allowlist: []
    denied_pairs: []
metadata:
  description: "Fictional small company ecosystem"
  users: ["alice", "bob", "carol", "admin"]
  reference_version: 1
  device_presentations:
    "alice-mac": "desktop"
    "bob-windows": "desktop"
    "carol-ubuntu": "laptop"
    "app-server": "server"
    "git-server": "server"
# Each machine is `computers/<id>/`: `computer.json`, and under `root/` the files
# it starts with at their own paths on it. Each service is `services/<id>/`:
# `service.json` for one the company runs, `overlay.json` for the company's
# content on the internet's service of that name. Machines and the company's own
# services are listed in the order the world file keeps them in.
include:
  - "services/mail/service.json"
  - "services/docs/service.json"
  - "services/chat/service.json"
  - "services/calendar/service.json"
  - "services/git/service.json"
  - "services/issues/service.json"
  - "computers/alice-mac/computer.json"
  - "computers/bob-windows/computer.json"
  - "computers/carol-ubuntu/computer.json"
  - "computers/app-server/computer.json"
  - "computers/git-server/computer.json"
  - "services/intranet/service.json"
  - "services/guide/service.json"
  - "services/alice-blog/service.json"
  - "services/bob-blog/service.json"
  - "services/northstar-eng/service.json"
  - "services/northstar-status/service.json"
  - "services/northstar-www/service.json"
  - "services/kitchen-speaker/service.json"
  - "services/livingroom-speaker/service.json"
  - "services/office-tv-speaker/service.json"
  - "services/messages/service.json"
  - "services/*/overlay.json"
