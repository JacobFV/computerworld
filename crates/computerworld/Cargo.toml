[package]
name = "computerworld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic synthetic computer worlds with native, Wasm and Python interfaces"

[features]
default = ["render", "internet"]
# The built-in internet every world joins unless it sets `internet: false`. Off, the
# package drops its public sites, and only worlds that opt out will boot.
internet = ["dep:cw-internet"]
render = ["dep:cw-render", "dep:png", "dep:jpeg-decoder"]

[dependencies]
cw-protocol = { path = "../core/protocol" }
cw-sdk = { path = "../core/sdk" }
cw-kernel = { path = "../core/kernel" }
cw-environment = { path = "../core/environment" }
cw-scene = { path = "../graphics/scene" }
cw-render = { path = "../graphics/render", optional = true }
# Screenshot encoding only; the renderer itself decodes with its own copy.
png = { version = "0.17", optional = true }
# Opening JPEG photos in the image editors. Same pinned, integer-only build the
# renderer uses, so a decoded photo is the same bytes natively and under Wasm.
jpeg-decoder = { version = "0.3", optional = true, default-features = false, features = [
    "platform_independent",
] }
cw-services = { path = "../services" }
cw-internet = { path = "../internet", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
cw-network = { path = "../machines/network" }
# `internet_links` reads the HTML the migrated sites now serve, to follow their links.
cw-web = { path = "../web/engine" }
url.workspace = true
cw-cad = { path = "../engines/cad" }
cw-applications = { path = "../applications" }
cw-raster = { path = "../engines/raster" }
cw-sheet = { path = "../engines/sheet" }
cw-sql = { path = "../engines/sql" }
cw-eda = { path = "../engines/eda" }
cw-video = { path = "../engines/video" }
png = "0.17"

[[example]]
name = "company"
path = "../../examples/native/company.rs"

[[example]]
name = "custom-service"
path = "../../examples/native/echo.rs"

[[example]]
name = "custom-app"
path = "../../examples/native/counter.rs"

[[example]]
name = "os-gallery"
path = "../../examples/native/os_gallery.rs"
