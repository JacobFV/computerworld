[package]
name = "computerworld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic synthetic computer worlds with native, Wasm and Python interfaces"

[features]
default = ["render"]
render = ["dep:cw-render", "dep:png", "dep:jpeg-decoder"]

[dependencies]
cw-protocol = { path = "../protocol" }
cw-sdk = { path = "../sdk" }
cw-kernel = { path = "../kernel" }
cw-environment = { path = "../environment" }
cw-scene = { path = "../scene" }
cw-render = { path = "../render", optional = true }
# Screenshot encoding only; the renderer itself decodes with its own copy.
png = { version = "0.17", optional = true }
# Opening JPEG photos in the image editors. Same pinned, integer-only build the
# renderer uses, so a decoded photo is the same bytes natively and under Wasm.
jpeg-decoder = { version = "0.3", optional = true, default-features = false, features = [
    "platform_independent",
] }
cw-services = { path = "../services" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
cw-network = { path = "../network" }
cw-cad = { path = "../cad" }
cw-applications = { path = "../applications" }
cw-raster = { path = "../raster" }
cw-sheet = { path = "../sheet" }
cw-sql = { path = "../sql" }
cw-eda = { path = "../eda" }
png = "0.17"

[[example]]
name = "company"
path = "../../examples/native/company.rs"

[[example]]
name = "custom-service"
path = "../../examples/custom-service/echo.rs"

[[example]]
name = "custom-app"
path = "../../examples/custom-app/counter.rs"

[[example]]
name = "os-gallery"
path = "../../examples/native/os_gallery.rs"
