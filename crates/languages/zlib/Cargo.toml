[package]
name = "cw-zlib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zlib's deflate (a faithful port, byte-exact with the real library, including Chromium's hashing variant that Node ships), inflate, gzip and brotli for the simulated runtimes and shell."

[dependencies]
brotli = { version = "8", default-features = false }
brotli-decompressor = { version = "5", default-features = false }
alloc-stdlib = "0.2"
alloc-no-stdlib = "2"

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
