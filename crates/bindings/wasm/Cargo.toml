[package]
name = "cw-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = ["internet"]
# The built-in internet. Without it the bundle is smaller and boots only worlds that set
# `internet: false`; `CW_WASM_INTERNET=0 scripts/build-wasm.sh` builds that way.
internet = ["computerworld/internet"]
[dependencies]
computerworld = { path = "../../computerworld", default-features = false, features = ["render"] }
cw-protocol = { path = "../../core/protocol" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
cw-scene = { path = "../../graphics/scene" }
cw-render = { path = "../../graphics/render" }
