[package]
name = "cw-python"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "computerworld"
crate-type = ["cdylib"]
[features]
default = ["internet"]
# The built-in internet. Without it the wheel is smaller and boots only worlds that set
# `internet: false`.
internet = ["cw/internet"]
[dependencies]
cw = { package = "computerworld", path = "../../computerworld", default-features = false, features = ["render"] }
serde.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
# The allocator (see `lib.rs`): the engine allocates small objects at a high rate.
mimalloc = { version = "0.1", default-features = false }
