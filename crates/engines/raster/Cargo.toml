[package]
name = "cw-raster"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic layered raster editing engine shared by the simulator's image editors"

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The reference decoder the encoder's output is checked against, built as the renderer
# builds it.
jpeg-decoder = { version = "0.3", default-features = false, features = [
    "platform_independent",
] }
