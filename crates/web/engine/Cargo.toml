[package]
name = "cw-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A deterministic HTML, CSS and DOM engine for the simulated browser: parse, cascade, lay out in fixed point, paint to a scene."

[dependencies]
cw-scene = { path = "../../graphics/scene" }
cw-protocol = { path = "../../core/protocol" }
cw-jsvm = { path = "../../languages/jsvm" }
cw-script-host = { path = "../../languages/script-host" }
serde.workspace = true
serde_json.workspace = true

[features]
# The parity and reftest runners in `tests/` call `html::parse`, `css::parse_stylesheet`
# and `style::cascade`; until those land the runners are `#[ignore]`d and the calls are
# compiled only with this feature on.
pipeline = []
# The WPT corpus run takes about half an hour; it is opted into separately.
wpt = ["pipeline"]
# Kept so `--features script` still resolves; the script layer is always built.
script = []

[dev-dependencies]
cw-render = { path = "../../graphics/render" }
