<!DOCTYPE html>
<!-- TodoMVC's Vue example (tastejs/todomvc ff43b02, MIT), its production build served
     unmodified from /vendor/oss-todomvc-vue.{js,css}. The bundle has no imports, so it
     runs as a deferred classic script (a module script cannot load from a file: page in
     Chromium); todomvc-common's base.js is left out. -->
<html lang="en" data-framework="vue">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="A TodoMVC written in Vue." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoMVC: Vue</title>
    <script defer src="/vendor/oss-todomvc-vue.js"></script>
    <link rel="stylesheet" href="/vendor/oss-todomvc-vue.css">
  </head>
  <body>
    <section class="todoapp">
    </section>
    <footer class="info">
      <p>Double-click to edit a todo</p>
      <p>Created by the TodoMVC Team</p>
      <p>Part of <a href="http://todomvc.com">TodoMVC</a></p>
    </footer>
  </body>
</html>
