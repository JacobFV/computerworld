<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cascade</title>
<style>
p { color: #0000ff; } .a { color: #cc0000; } p { color: #00aa00; } #x { color: #cc0000; } .b.c { color: #cc0000; } .b { color: #000000; }
</style>
</head>
<body>
<p class="a">red by class</p><p id="x">red by id</p><p class="b c">red by two classes</p>
</body>
