[package]
name = "cw-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The reactive UI runtime for compiled TSX apps: mounts cw-tsx IR onto a cw-web document and updates it with React 18 semantics, no JS VM."

[dependencies]
cw-web = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
cw-tsx = { path = "../tsx" }
cw-scene = { path = "../../graphics/scene" }
cw-render = { path = "../../graphics/render" }
cw-jsvm = { path = "../../languages/jsvm" }
