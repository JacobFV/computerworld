[package]
name = "cw-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A deterministic HTML, CSS and DOM engine for the simulated browser: parse, cascade, lay out in fixed point, paint to a scene."

[dependencies]
cw-scene = { path = "../scene" }
cw-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true

[features]
# The parity and reftest runners in `tests/` call `html::parse`, `css::parse_stylesheet`
# and `style::cascade`; until those land the runners are `#[ignore]`d and the calls are
# compiled only with this feature on.
pipeline = []

[dev-dependencies]
cw-render = { path = "../render" }
