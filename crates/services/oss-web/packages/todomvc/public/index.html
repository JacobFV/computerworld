<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TodoMVC</title>
<style>
body { font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #4d4d4d; background: #f5f5f5; margin: 0; }
main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
h1 { font-size: 64px; font-weight: 200; color: #b83f45; margin: 0 0 8px; }
p { margin: 0 0 24px; }
ul { list-style: none; padding: 0; margin: 0; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
li { border-bottom: 1px solid #ededed; }
li:last-child { border-bottom: none; }
a { display: block; padding: 16px 20px; color: #b83f45; text-decoration: none; font-size: 20px; }
a:hover { background: #fafafa; }
footer { margin-top: 32px; font-size: 12px; color: #999; }
</style>
</head>
<body>
<main>
<h1>TodoMVC</h1>
<p>The same todo app, written with each framework.</p>
<ul>
<li><a id="react" href="/examples/react/dist/">React</a></li>
<li><a id="vue" href="/examples/vue/dist/">Vue</a></li>
</ul>
<footer>The examples are built unmodified from tastejs/todomvc (MIT; see <a href="/license.md" style="display:inline;padding:0;font-size:12px">license.md</a>).</footer>
</main>
</body>
</html>
