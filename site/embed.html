<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComputerWorld — machines</title>
<meta name="description" content="The ComputerWorld slideshow on its own: machines running in the page, for embedding in a frame.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0b0a'/%3E%3Cpath d='M9 20l4-8 3 5 2-3 5 6z' fill='%23ffb454'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./embed.css">
<script>/* Before the first paint: the reader's stored choice, or the device's own setting. */
(function(){try{var t=localStorage.getItem('cw-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}})();</script>
</head>
<body>

<!-- The slideshow, and nothing else. Same stage, same cast, same app.js as the
     front page: this is that hero in a frame, not a copy of it. A link like
     `embed.html#slack` opens on that machine, exactly as it does there. -->
<main>

<section id="stage" class="stage" aria-roledescription="carousel" aria-label="Machines running in this page">
  <div class="track" id="track"></div>
  <nav class="pager" aria-label="Machines">
    <button id="prev" aria-label="Previous machine">&larr;</button>
    <p class="caption" id="caption" aria-live="polite"><b id="caption-title"></b><span id="caption-summary"></span><span id="caption-where"></span></p>
    <button id="next" aria-label="Next machine">&rarr;</button>
  </nav>
  <noscript><img src="./media/scenes/mac-freecad.jpg" width="960" height="600" alt="FreeCAD on macOS inside the simulation, with a bored mounting plate in the 3D view"></noscript>
</section>

<a class="from" href="./" target="_blank" rel="noopener">ComputerWorld</a>

</main>

<script type="module" src="./app.js"></script>
</body>
</html>
