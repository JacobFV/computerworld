[workspace]
resolver = "2"
# Group directories are not packages; enumerate the package levels explicitly.
members = [
    "crates/core/*",
    "crates/machines/*",
    "crates/languages/*",
    "crates/web/*",
    "crates/graphics/*",
    "crates/engines/*",
    "crates/bindings/*",
    "crates/applications",
    "crates/internet",
    "crates/services",
    "crates/services/assistant",
    "crates/services/bank",
    "crates/services/calendar",
    "crates/services/chat",
    "crates/services/common",
    "crates/services/discord",
    "crates/services/docs",
    "crates/services/drive",
    "crates/services/forum",
    "crates/services/geo",
    "crates/services/git",
    "crates/services/issues",
    "crates/services/mail",
    "crates/services/media",
    "crates/services/messages",
    "crates/services/node-app",
    "crates/services/oss-web",
    "crates/services/press",
    "crates/services/search",
    "crates/services/shop",
    "crates/services/slack",
    "crates/services/social",
    "crates/services/speaker",
    "crates/services/static-site",
    "crates/services/wiki",
    "crates/computerworld",
    "benchmarks/runner",
]
default-members = ["crates/computerworld"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["Computerworld contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
url = { version = "2", features = ["serde"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1

# The CAD kernel's booleans are compute-bound; unoptimised they make debug builds
# (and every test that drives the modeller) an order of magnitude slower.
[profile.dev.package.cw-cad]
opt-level = 2

# The language runtimes recurse in Rust when native code calls back into
# user code; unoptimised frames would need tens of KiB per level, so they are
# optimised even in dev and test builds.
[profile.dev.package.cw-pyvm]
opt-level = 2

[profile.dev.package.cw-regex]
opt-level = 2

# Sites rasterise cover artwork per request; unoptimised, a page of covers is slow.
[profile.dev.package.cw-artwork]
opt-level = 2

# The maps sites rasterise a street map per request; unoptimised, a wide tile is slow.
[profile.dev.package.cw-map]
opt-level = 2

[profile.dev.package.cw-jsvm]
opt-level = 2
