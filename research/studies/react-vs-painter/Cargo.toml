# The Painter half of the React-vs-Painter study (research/notes/react-vs-painter.md):
# three of the framework-parity apps written against cw-applications' Painter, as a
# coding agent writes a native app here, rendered beside the React originals and
# scored by the same layout-fault checks. Not part of the workspace or the product.
#
#     CARGO_TARGET_DIR=../../../target/research/react-vs-painter cargo run --release
[package]
name = "react-vs-painter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cw-applications = { path = "../../../crates/applications" }
cw-scene = { path = "../../../crates/graphics/scene" }
cw-render = { path = "../../../crates/graphics/render" }
cw-web = { path = "../../../crates/web/engine", features = ["pipeline"] }
serde_json = "1"
png = "0.17"

[workspace]
